[project]
name = "signet"
version = "0.1.0"
description = "Proof of origin for documents, anchored to the issuer's own domain in DNS."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rajeev Chaurasia", email = "Rajeevchaurasia.dev@gmail.com" }]
keywords = ["document-authenticity", "provenance", "dns", "ed25519", "fraud-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=44.0",
    "httpx>=0.28",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "pyzbar>=0.1.9",
    "qrcode>=8.0",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
signet = "signet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "types-qrcode>=8.2.0.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Dependency inversion, enforced. The domain must never reach a vendor directly.
"signet.adapters".msg = "core, ports and verify import from signet.ports only (ADR 0006)."

[tool.ruff.lint.per-file-ignores]
# Adapters are the vendor layer, and the composition root and its tests are the
# places allowed to see it. The ban exists to protect core, ports, verify and issue.
"src/signet/adapters/**" = ["TID251"]
"src/signet/cli.py" = ["TID251"]
"src/signet/api/**" = ["TID251"]
"tests/**" = ["TID251"]
"scripts/**" = ["TID251"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Fakes are imported as tests.fakes, so the repo root has to be importable.
pythonpath = ["."]

[tool.coverage.run]
source = ["signet"]
branch = true

[tool.coverage.report]
skip_covered = false
# Mirrors --cov-fail-under in ci.yml so local runs agree with the gate.
fail_under = 80
