# Everything a reviewer would otherwise have to take on trust.
#
# The suite runs with no credentials at all, and is blocked from opening a
# socket, so a fork with no secrets gets the same green tick as we do. A build
# that only passes for people holding the keys proves nothing about the code.
#
# Secret scanning runs over the full history rather than the working tree,
# because the repository is public and a key removed in a later commit is still
# a key that was published.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SIGNET_FIXTURES: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: types
        run: uv run mypy
      - name: prose hygiene
        run: uv run python scripts/check_prose.py
      - name: tests
        run: uv run pytest --cov=signet --cov-branch --cov-fail-under=80

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  # The gitleaks binary rather than their action. The action requires a paid
  # licence for any repository owned by an organisation, and refuses to run
  # without one; the scanner itself is open source and has no such condition.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
      - name: scan the full history
        run: ./gitleaks git --no-banner --redact --exit-code 1
