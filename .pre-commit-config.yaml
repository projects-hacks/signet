repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # xano/ is pulled from the workspace and has to stay byte-identical to
      # what Xano generated, or every pull shows diffs we did not make.
      - id: trailing-whitespace
        exclude: ^xano/
      - id: end-of-file-fixer
        exclude: ^xano/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prose
        name: prose hygiene
        entry: uv run python scripts/check_prose.py
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy strict
        entry: uv run python -m mypy
        language: system
        pass_filenames: false
        always_run: true

      # At push rather than commit: the suite is too slow to sit in front of every
      # commit, and a broken test reaching the remote is the thing worth stopping.
      - id: pytest
        name: pytest
        entry: uv run python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
